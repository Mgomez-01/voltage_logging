# Alternative PlatformIO configurations if the main platformio.ini fails.
# Copy the section you need into platformio.ini.
# All of them need ArduinoJson 7.x (the code uses the v7 JsonDocument API)
# and LittleFS for the web page upload.

# Option 1: Specific stable platform version
[env:esp12e_stable]
platform = espressif8266@4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0

# Option 2: Generic ESP8285 module
[env:esp8266_generic]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0

# Option 3: NodeMCU with explicit library owners
[env:nodemcu]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0
