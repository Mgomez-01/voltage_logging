; ESP8266 Voltage + Temperature Logger (SD card + PWM heater)
; Build/upload one environment at a time: pio run -e <env> [-t upload|uploadfs]
; or: make deploy ENV=<env>

; NodeMCU v2 (default)
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Upload settings
monitor_speed = 115200
upload_speed = 921600

; Library dependencies
lib_deps = 
    ArduinoJson@^7.0.0
    WebSockets@^2.4.0

; Build flags for memory optimization
build_flags = 
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -DMMU_IRAM_SIZE=0x8000
    -DMMU_ICACHE_SIZE=0x8000

; LittleFS holds only the web page (data/, `pio run -t uploadfs`).
; Sensor logs go to the SD card (SD/SPI libraries come with the core).
board_build.filesystem = littlefs

; Monitor settings
monitor_filters = 
    esp8266_exception_decoder
    time
    default

; Alternative environments for different boards
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
lib_deps = 
    ArduinoJson
    WebSockets

; LittleFS holds only the web page (data/, `pio run -t uploadfs`).
; Sensor logs go to the SD card (SD/SPI libraries come with the core).
board_build.filesystem = littlefs

[env:wemos_d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps = 
    ArduinoJson
    WebSockets

; LittleFS holds only the web page (data/, `pio run -t uploadfs`).
; Sensor logs go to the SD card (SD/SPI libraries come with the core).
board_build.filesystem = littlefs

; Build flags for memory optimization
build_flags = 
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -DMMU_IRAM_SIZE=0x8000
    -DMMU_ICACHE_SIZE=0x8000

; Upload settings
upload_protocol = esptool
upload_speed = 460800
