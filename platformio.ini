[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Upload settings
monitor_speed = 115200
upload_speed = 921600

; Library dependencies
lib_deps = 
    ArduinoJson@^7.0.0
    WebSockets@^2.4.0

; Build flags for LittleFS and memory optimization
build_flags = 
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -DMMU_IRAM_SIZE=0x8000
    -DMMU_ICACHE_SIZE=0x8000

; Use LittleFS instead of SPIFFS
board_build.filesystem = littlefs

; Monitor settings
monitor_filters = 
    esp8266_exception_decoder
    time
    default

; Alternative environments for different boards
[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
lib_deps = 
    ArduinoJson
    WebSockets

; Use LittleFS instead of SPIFFS
board_build.filesystem = littlefs

[env:wemos_d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps = 
    ArduinoJson
    WebSockets

; Use LittleFS instead of SPIFFS
board_build.filesystem = littlefs

; Build flags for LittleFS and memory optimization
build_flags = 
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -DMMU_IRAM_SIZE=0x8000
    -DMMU_ICACHE_SIZE=0x8000

; Upload settings
upload_protocol = esptool
upload_speed = 460800

; ========================================
; TESTING ENVIRONMENTS
; ========================================

; Native testing environment (runs on your computer, no hardware needed)
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = 
    -DUNIT_TEST
    -std=c++11
    -Wall
    -Wextra

; Hardware testing environment (ESP8266)
[env:test_esp12e]
platform = espressif8266
board = esp12e
framework = arduino
test_framework = unity
test_build_src = yes
monitor_speed = 115200
lib_deps = 
    ArduinoJson
    WebSockets
build_flags = 
    -DUNIT_TEST
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
board_build.filesystem = littlefs
