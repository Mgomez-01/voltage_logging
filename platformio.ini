; ESP8266 Temperature Logger, PCB version (pcb_voltage_logging board)
; MCP3208 ADC + SD card on SPI, WS2812B status LED, PWM heater.
; Build/upload: pio run -e esp8266 [-t upload|uploadfs], or: make deploy
;
; The PCB takes a NodeMCU v2 in its socket, so this is the only environment.
; (The old breadboard/mux build, including the esp12e and wemos_d1_mini
; environments, stays on the main branch.)

; NodeMCU v2
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Upload settings
monitor_speed = 115200
upload_speed = 921600

; Library dependencies
lib_deps = 
    ArduinoJson@^7.0.0
    WebSockets@^2.4.0
    makuna/NeoPixelBus@^2.8.0      ; WS2812B status LED (DMA on GPIO3/RX)

; Build flags for memory optimization
build_flags = 
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DVTABLES_IN_FLASH
    -DMMU_IRAM_SIZE=0x8000
    -DMMU_ICACHE_SIZE=0x8000

; LittleFS holds only the web page (data/, `pio run -t uploadfs`).
; Sensor logs go to the SD card (SD/SPI libraries come with the core; the
; MCP3208 shares the SPI bus).
board_build.filesystem = littlefs

; Monitor settings
monitor_filters = 
    esp8266_exception_decoder
    time
    default
